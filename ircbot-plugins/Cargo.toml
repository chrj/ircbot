[package]
name = "ircbot-plugins"
version = "0.7.0"
edition = "2021"
description = "Standard plugins for the ircbot IRC bot framework"
license = "MIT"
repository = "https://github.com/chrj/ircbot"
readme = "README.md"
keywords = ["irc", "bot", "plugin", "ircbot"]
categories = ["network-programming"]

# One feature for each plugin. All are on by default; a bot that wants fewer
# uses `default-features = false` and names the plugins it needs.
[features]
default = ["notify", "ops", "seen"]
notify = ["dep:ircbot"]
ops = ["dep:ircbot"]
seen = ["dep:ircbot"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# The plugins keep their data in the store of `ircbot`. Each plugin feature
# enables this dependency. If no plugin feature is on, the crate is empty and
# does not need it.
ircbot = { version = "0.7.0", path = "../ircbot", features = ["store"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "seen_bot"
required-features = ["seen"]
test = true
