[package]
name = "ircbot-macros"
version = "0.4.2"
edition = "2021"
description = "Procedural macros for the ircbot IRC bot framework"
license = "MIT"
repository = "https://github.com/chrj/ircbot"
readme = "../README.md"
keywords = ["irc", "bot", "macros", "proc-macro"]
categories = ["network-programming"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
cron = "0.17"
chrono-tz = "0.10"
