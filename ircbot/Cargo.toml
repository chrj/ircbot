[package]
name = "ircbot"
version = "0.1.9"
edition = "2021"
description = "An async IRC bot framework for Rust powered by Tokio and procedural macros"
license = "MIT"
repository = "https://github.com/chrj/ircbot"
readme = "README.md"
keywords = ["irc", "bot", "async", "tokio", "framework"]
categories = ["network-programming", "asynchronous"]

[features]
integration = []

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
futures = "0.3"
ircbot-macros = { version = "0.1.9", path = "../ircbot-macros" }
irc-proto = { version = "1", default-features = false }
cron = "0.15"
chrono = "0.4"
chrono-tz = "0.10"

[dev-dependencies]
testcontainers = "0.27"
irc = { version = "1", default-features = false }
trybuild = "1.0"

[[example]]
name = "basic_bot"

[[example]]
name = "stateful_bot"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
