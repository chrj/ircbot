name: Tag
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-plz:
    name: Release-Plz (Versioning & Crates.io)
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.rp.outputs.releases }}
    steps:
      # Authenticate as the GitHub App so release-plz can create the protected
      # `v*` tags: the app is the only bypass actor on the `Versions` tag ruleset.
      # A PAT acting as a user is not in that bypass list and would be rejected.
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use the app token so git pushes (release PR branch) run as the app too.
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Release-Plz
        id: rp
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
