name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  bump-and-publish-ircbot-macros:
    name: Bump and publish ircbot-macros
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Update ircbot-macros version in Cargo.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update ircbot-macros package version
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" ircbot-macros/Cargo.toml
          # Regenerate Cargo.lock for the workspace member
          cargo update -p "path+file://$(pwd)/ircbot-macros"
      - name: Open PR for ircbot-macros version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ircbot-macros/Cargo.toml Cargo.lock
          # Only commit if there are staged changes (version may already be correct)
          if ! git diff --staged --quiet; then
            BRANCH="chore/bump-ircbot-macros-${{ steps.version.outputs.version }}"
            git checkout -b "$BRANCH"
            git commit -m "chore: bump ircbot-macros version to ${{ steps.version.outputs.version }}"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: bump ircbot-macros version to ${{ steps.version.outputs.version }}" \
              --body "Automated version bump triggered by release \`${{ github.ref_name }}\`." \
              --base main \
              --head "$BRANCH"
            gh pr merge --auto --merge "$BRANCH" \
              || echo "Warning: auto-merge could not be enabled. Please merge the PR manually once CI passes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ircbot-macros
        run: cargo publish --package ircbot-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for ircbot-macros to be available on crates.io
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for ircbot-macros $VERSION on crates.io..."
          for i in $(seq 1 20); do  # up to 20 attempts (5 min total)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/ircbot-macros/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "ircbot-macros $VERSION is available"
              break
            fi
            echo "Attempt $i: not yet available (HTTP $STATUS), retrying in 15s..."
            sleep 15  # crates.io index propagation typically takes under a minute
          done

  bump-and-publish-ircbot:
    name: Bump and publish ircbot
    runs-on: ubuntu-latest
    needs: bump-and-publish-ircbot-macros
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Update ircbot version in Cargo.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Update ircbot package version (first occurrence)
          sed -i "0,/^version = \".*\"/s/^version = \".*\"/version = \"$VERSION\"/" ircbot/Cargo.toml
          # Update ircbot-macros dependency version inside ircbot/Cargo.toml
          sed -i "/ircbot-macros/s/version = \"[^\"]*\"/version = \"$VERSION\"/" ircbot/Cargo.toml
          # Regenerate Cargo.lock - ircbot-macros $VERSION is now on crates.io so this resolves correctly
          cargo update -p "path+file://$(pwd)/ircbot"
      - name: Open PR for ircbot version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ircbot/Cargo.toml Cargo.lock
          # Only commit if there are staged changes (version may already be correct)
          if ! git diff --staged --quiet; then
            BRANCH="chore/bump-ircbot-${{ steps.version.outputs.version }}"
            git checkout -b "$BRANCH"
            git commit -m "chore: bump ircbot version to ${{ steps.version.outputs.version }}"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore: bump ircbot version to ${{ steps.version.outputs.version }}" \
              --body "Automated version bump triggered by release \`${{ github.ref_name }}\`." \
              --base main \
              --head "$BRANCH"
            gh pr merge --auto --merge "$BRANCH" \
              || echo "Warning: auto-merge could not be enabled. Please merge the PR manually once CI passes."
            # Move the tag to the version-bump commit so the published crate
            # and the tagged source tree are in sync.
            git tag -f "$GITHUB_REF_NAME"
            git push origin -f "refs/tags/$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ircbot
        run: cargo publish --package ircbot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
