name: PR

# PR-only checks. These run on title edits too (not just code pushes), so that
# fixing a non-conforming title re-triggers the gate.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Validate the PR title against the Conventional Commits spec. release-plz
      # squash-merges PRs using their title as the commit message, so the title
      # is what ends up driving changelog generation and version bumps.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so cargo-semver-checks can build the base branch as the
          # baseline to diff the public API against.
          fetch-depth: 0
      # Nightly is required: cargo-semver-checks generates rustdoc JSON, which is
      # an unstable rustc feature.
      #
      # Both the toolchain and cargo-semver-checks are pinned, and must be bumped
      # together. Unstable rustdoc JSON bumps its format version every few weeks,
      # and cargo-semver-checks only parses the versions it knows about, so an
      # unpinned pair silently drifts apart and breaks this job. This combination
      # is known good: nightly-2026-07-20 emits format v60, which
      # cargo-semver-checks 0.49.0 supports.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-20
      - uses: taiki-e/install-action@v2.86.8
        with:
          tool: cargo-semver-checks@0.49.0
      - name: Detect breaking API changes
        id: semver
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          # A non-zero exit does not by itself mean "breaking change": it also
          # covers tooling failures, e.g. cargo-semver-checks not yet supporting
          # the rustdoc JSON format emitted by the current nightly. Treating
          # those as breaking changes blocks every PR with a misleading error, so
          # only the explicit summary line counts as a finding.
          set +e
          output=$(cargo semver-checks --workspace --baseline-rev "origin/$BASE_REF" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$output" | grep -q "semver requires new major version"; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::cargo-semver-checks exited $status without reporting an API verdict, so the public API was not checked. This is a tooling failure, not a breaking change. If the log shows an unsupported rustdoc format, a newer cargo-semver-checks is needed for the current nightly."
            exit 1
          fi
      - name: Require a breaking-change marker in the PR title
        if: steps.semver.outputs.breaking == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits flags a breaking change with a `!` before the
          # colon, e.g. `feat!: ...` or `fix(scope)!: ...`.
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            echo "Incompatible API change is declared in the PR title. OK."
          else
            echo "::error::cargo-semver-checks detected an incompatible (breaking) API change, but the PR title does not declare one."
            echo "Add a '!' before the colon to mark it, e.g. 'feat!: ...' or 'fix(scope)!: ...'."
            exit 1
          fi
