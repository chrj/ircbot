name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly, so a new advisory shows up without a push.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Test without features, and with `tls` and `store`. Each build
      # compiles code that the other leaves out. `tls` also builds the
      # `tls_bot` example.
      - run: cargo test --workspace
      - run: cargo test --workspace --features tls,store

  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      # Lint without and with the features, for the same reason as the tests.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features tls,store -- -D warnings

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Pull ngircd image
        run: docker pull ghcr.io/ngircd/ngircd:latest
      - name: Run integration tests
        run: cargo test --features integration --test integration -- --test-threads=1

  security:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-audit
      - run: cargo audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Without the features, a doc link to a feature item breaks. With the
      # features, their items get docs, which docs.rs also builds. Thus build
      # both.
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo doc --no-deps --workspace --features tls,store
        env:
          RUSTDOCFLAGS: "-D warnings"

  sync-check:
    name: Sync check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check duplicated files are in sync
        run: |
          diff README.md ircbot/README.md
          diff ircbot-macros/docs/command.md ircbot/docs/command.md
          diff ircbot-macros/docs/on.md ircbot/docs/on.md
